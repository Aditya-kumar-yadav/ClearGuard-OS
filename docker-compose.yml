version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurorapay-postgres
    environment:
      POSTGRES_DB: aurorapay_db
      POSTGRES_USER: aurora_user
      POSTGRES_PASSWORD: aurora_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora_user -d aurorapay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurorapay-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aurora_user:aurora_pass@postgres:5432/aurorapay_db
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurorapay-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:

